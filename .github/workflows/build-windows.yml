name: Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the unit tests on Windows
        run: python -m unittest -v

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packaging tools
        run: python -m pip install pyinstaller pywebview
      - name: Build BrowserForensics.exe
        run: python packaging/build.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: BrowserForensics-windows
          path: dist/BrowserForensics.exe
          retention-days: 30
